      - PYC64 (tools): modules/tools/index.md
      - C64GameTutorial (tutorial): modules/tutorial/index.md
      - C64-Scrapy (scraper): modules/scraper/index.md
      - C64-KB-Agent (kb-agent): modules/kb-agent/index.md
